<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Galeria de Modelos</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#2a1630;--panel:#3d2346;--line:#5e3a66;--ink:#fff6e8;--dim:#cdb8d3;--gold:#ffd12a;--purple:#8a4dd6}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px Nunito,sans-serif}
#app{display:grid;grid-template-columns:280px 1fr 300px;height:100%}
#list,#side{background:var(--panel);overflow:auto;padding:10px}#list{border-right:3px solid var(--line)}#side{border-left:3px solid var(--line)}
h1{font:22px "Lilita One",sans-serif;margin:4px 0 8px;color:var(--gold)}h2{font:15px "Lilita One",sans-serif;margin:12px 0 4px;color:var(--dim);letter-spacing:.5px}
input,select,textarea,button{font:inherit;color:var(--ink);background:#25132b;border:2px solid var(--line);border-radius:10px;padding:6px 8px}
#q{width:100%}button{cursor:pointer;background:var(--purple);border-color:#1a0b1c;font-family:"Lilita One",sans-serif}button:hover{filter:brightness(1.15)}
.it{display:flex;justify-content:space-between;gap:6px;padding:5px 8px;border-radius:8px;cursor:pointer}.it:hover{background:#ffffff14}.it.on{background:var(--purple)}.it small{color:var(--dim)}.it .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);align-self:center}
#view{position:relative;min-width:0}#cv{width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;left:10px;top:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;pointer-events:none}#hud>*{pointer-events:auto}
#title{font:20px "Lilita One",sans-serif;text-shadow:0 2px 0 #000;margin-right:auto}
.row{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap}.row label{color:var(--dim);min-width:70px}
textarea{width:100%;min-height:150px;resize:vertical}#saved{color:#8dff6a;font-size:12px;min-height:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px}.kv b{color:var(--dim);font-weight:600}
#help{position:absolute;bottom:10px;left:10px;color:var(--dim);font-size:12px;text-shadow:0 1px 0 #000}
@media (max-width:860px){#app{grid-template-columns:1fr;grid-template-rows:auto 55vh auto;height:auto}#list{max-height:30vh;border:0;border-bottom:3px solid var(--line)}#side{border:0;border-top:3px solid var(--line)}}
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="app">
  <div id="list"><h1>Modelos</h1><input id="q" placeholder="Buscar (nome, arquivo)…"><div id="items"></div></div>
  <div id="view"><canvas id="cv"></canvas>
    <div id="hud"><span id="title">—</span><select id="anim"></select><button id="spin">Girar</button><button id="cmp">Comparar com Thomas</button><button id="cam">Visão do jogo</button></div>
    <div id="help">Arraste para girar · roda/pinça para zoom · botão direito arrasta</div></div>
  <div id="side">
    <h2>INFORMAÇÕES</h2><div class="kv" id="info"></div>
    <h2>COR (tinta)</h2><div class="row"><input type="color" id="tint"><button id="tintReset">Original</button></div>
    <h2>SUAS CORREÇÕES</h2><textarea id="note" placeholder="Ex.: cabeça grande demais; quero o urso mais gordo; trocar a cor da capa para vermelho…"></textarea>
    <div class="row"><button id="saveNote">Salvar nota</button><span id="saved"></span></div>
    <h2>TODAS AS NOTAS</h2><div id="allNotes" style="font-size:12px;color:var(--dim)"></div>
  </div>
</div>
<script type="module" src="src/viewer.js"></script>
</body>
</html>
